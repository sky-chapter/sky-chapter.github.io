<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }} | {{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 155 }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  {% seo %}
</head>
<body>
  <header class="top">
    <a class="brand" href="{{ '/' | relative_url }}">SKY CHAPTER</a>
    <nav>
      <a href="{{ '/' | relative_url }}">Today</a>
      <a href="{{ '/methodology' | relative_url }}">Method</a>
      <a href="{{ '/archive/' | relative_url }}">Archive</a>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <footer class="foot">
    <p>Reflection and entertainment, not a prediction or financial/medical/legal advice.</p>
    <p>New chapter daily at 10:00 UTC · <a href="{{ '/llms.txt' | relative_url }}">llms.txt</a></p>
  </footer>
</body>
</html>
