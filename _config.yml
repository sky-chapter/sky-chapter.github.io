title: Sky Chapter
description: The sky, one chapter a day — real planetary math, plain-English ELI5.
url: https://skychapter.sok.lv
baseurl: ""
lang: en
future: true          # эпизод даты D публикуется за день — Jekyll не должен прятать его
markdown: kramdown
permalink: pretty

plugins:
  - jekyll-sitemap

collections:
  daily:
    output: true
    permalink: /archive/:name/
  signs:
    output: true
    permalink: /signs/:name/
  notes:
    output: true
    permalink: /notes/:name/
  weekly:
    output: true
    permalink: /weekly/:name/
  monthly:
    output: true
    permalink: /monthly/:name/
  quarterly:
    output: true
    permalink: /quarterly/:name/
  yearly:
    output: true
    permalink: /yearly/:name/

defaults:
  - scope:
      path: ""
      type: "daily"
    values:
      layout: "daily"
  - scope:
      path: ""
      type: "signs"
    values:
      layout: "sign"
  - scope:
      path: ""
      type: "weekly"
    values:
      layout: "weekly"
  - scope:
      path: ""
      type: "monthly"
    values:
      layout: "monthly"
  - scope:
      path: ""
      type: "quarterly"
    values:
      layout: "quarterly"
  - scope:
      path: ""
      type: "yearly"
    values:
      layout: "yearly"

# Google integrations:
# Search Console: подтверждение уже настроено на уровне домена sok.lv.
# GA4 Measurement ID (Google tag) — общий для sok.lv
google_analytics: "G-TJ0Y7GCCC3"
# google_tag_manager: "GTM-XXXXXXX"   # если позже появится контейнер GTM — gtm.js
# google_site_verification: "CODE_FROM_SEARCH_CONSOLE"   # не нужен, SC по домену

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
